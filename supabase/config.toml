project_id = "bubu-world"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false

[auth.email]
# Keep the email provider enabled for existing admin password logins.
# The global auth.enable_signup=false blocks public account registration.
enable_signup = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "15MiB"
